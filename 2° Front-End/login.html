<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Akiba Store</title>
    
    <!-- Google Fonts: Changa -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@700;800&display=swap" rel="stylesheet">

    <!-- CSS local de Bootstrap -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background-color: #0b0f19;
            color: #f8f9fa;
        }
        
        h1, h2, h3, .navbar-brand {
            font-family: 'Changa', sans-serif !important;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* EFECTO DE ILUMINACIÓN AL PASAR EL CURSOR */
        h1:hover, h2:hover, h3:hover, .navbar-brand:hover {
            text-shadow: 0 0 15px rgba(13, 110, 253, 0.8), 0 0 30px rgba(13, 110, 253, 0.4);
            transition: text-shadow 0.3s ease;
        }

        .hover-light:hover {
            color: #ffffff !important;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* Navbar futurista */
        .navbar-futurista {
            background: rgba(11, 15, 25, 0.95) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Contenedor principal con Video de Fondo */
        .auth-section {
            position: relative;
            background-color: #0b0f19;
            overflow-y: auto;
            min-height: calc(100vh - 76px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 0;
        }

        .hero-video-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 0;
            opacity: 0.45;
        }

        .hero-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(13, 110, 253, 0.2) 0%, rgba(11, 15, 25, 0.92) 85%);
            z-index: 1;
        }

        /* Tarjeta de inicio de sesión */
        .auth-card {
            background: rgba(18, 22, 33, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(13, 110, 253, 0.3);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.85);
            transition: all 0.3s ease;
        }

        .auth-card:hover {
            box-shadow: 0 0 35px rgba(13, 110, 253, 0.4);
            border-color: #0d6efd;
        }

        .btn-neon {
            background: linear-gradient(135deg, #0d6efd 0%, #0043a8 100%);
            border: none;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(13, 110, 253, 0.4);
            transition: all 0.3s ease;
        }

        .btn-neon:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(13, 110, 253, 0.8);
            color: #fff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        /* Estilo para las alertas personalizadas dentro de la web */
        .mensaje-flotante {
            display: none;
            border-radius: 10px;
            font-family: monospace;
            font-size: 0.9rem;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- 1. BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-futurista sticky-top border-bottom border-secondary" style="z-index: 10;">
        <div class="container">
            <a class="navbar-brand text-danger d-flex align-items-center gap-2" href="index.html">
                <img src="img/logo.gif" alt="Logo Akiba Store" width="40" height="40" class="rounded-circle border border-danger object-fit-cover">
                <span class="text-light">Akiba <span class="text-primary">Store</span></span>
            </a>
            
            <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="bi bi-house-fill me-1"></i> Volver al Inicio
            </a>
        </div>
    </nav>

    <!-- 2. SECCIÓN DE LOGIN CON VIDEO DE FONDO -->
    <section class="auth-section flex-grow-1">
        <video autoplay muted loop playsinline class="hero-video-bg">
            <source src="video/loginyregistro.mp4" type="video/mp4">
            Tu navegador no soporta videos HTML5.
        </video>
        <div class="hero-overlay"></div>

        <div class="container position-relative z-2 py-4" style="max-width: 480px;">
            <div class="auth-card p-4 p-md-5 text-light">
                
                <div class="text-center mb-4 border-bottom border-secondary pb-3">
                    <h2 class="h3 text-white mb-1">Iniciar Sesión</h2>
                    <p class="text-light small font-monospace mb-0">Accede a tu cuenta de Akiba Store</p>
                </div>

                <!-- Alerta personalizada elegante -->
                <div id="alertaLogin" class="alert alert-success mensaje-flotante text-center mb-3" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i> <span id="textoAlerta">¡Bienvenido de vuelta a Akiba Store!</span>
                </div>

                <form id="formLogin">
                    <div class="mb-3 text-start">
                        <label for="emailLogin" class="form-label small fw-bold text-light">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-primary"><i class="bi bi-envelope-fill"></i></span>
                            <input type="email" class="form-control bg-dark text-light border-secondary" id="emailLogin" placeholder="nombre@correo.com" required>
                        </div>
                    </div>

                    <div class="mb-4 text-start">
                        <label for="passwordLogin" class="form-label small fw-bold text-light">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-primary"><i class="bi bi-shield-lock-fill"></i></span>
                            <input type="password" class="form-control bg-dark text-light border-secondary" id="passwordLogin" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-neon w-100 py-2 rounded-pill mb-3">INGRESAR</button>
                    
                    <div class="text-center">
                        <a href="registro.html" class="text-decoration-none small text-primary hover-light font-monospace">¿No tienes una cuenta? Regístrate aquí</a>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- SCRIPT DE LOGIN CON VALIDACIÓN ESTRICTA DE ADMIN -->
    <script>
        document.getElementById("formLogin").addEventListener("submit", function(e) {
            e.preventDefault();
            
            const emailInput = document.getElementById("emailLogin").value.trim().toLowerCase();
            const passwordInput = document.getElementById("passwordLogin").value;
            const alerta = document.getElementById("alertaLogin");
            const textoAlerta = document.getElementById("textoAlerta");

            // Validar credenciales de Administrador exactas
            if (emailInput === "admin@akibastore.cl" && passwordInput === "admin123") {
                localStorage.setItem("akiba_sesion", "true");
                localStorage.setItem("akiba_nombre", "Seba Admin");
                localStorage.setItem("akiba_correo", "admin@akibastore.cl");
                localStorage.setItem("akiba_es_admin", "true"); // ¡Activa el rol de administrador!
                localStorage.setItem("akiba_avatar", "img/logo.gif");
                
                textoAlerta.textContent = "¡Bienvenido, Administrador!";
                alerta.className = "alert alert-warning mensaje-flotante text-center mb-3 fw-bold";
            } else {
                // Usuario Normal
                localStorage.setItem("akiba_sesion", "true");
                localStorage.setItem("akiba_nombre", emailInput.split('@')[0]); // Usa la parte del correo como nombre
                localStorage.setItem("akiba_correo", emailInput);
                localStorage.removeItem("akiba_es_admin"); // Se asegura de que no sea admin
                localStorage.setItem("akiba_avatar", "img/logo.gif");

                textoAlerta.textContent = "¡Bienvenido de vuelta a Akiba Store!";
                alerta.className = "alert alert-success mensaje-flotante text-center mb-3";
            }

            alerta.style.display = "block";

            // Redirigir al inicio después de 1.2 segundos
            setTimeout(() => {
                window.location.href = "index.html";
            }, 1200);
        });
    </script>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
