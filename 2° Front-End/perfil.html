<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil y Seguridad - Akiba Store</title>
    
    <!-- Google Fonts: Changa -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@700;800&display=swap" rel="stylesheet">

    <!-- CSS local de Bootstrap -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background-color: #0b0f19;
            color: #f8f9fa;
        }
        
        h1, h2, h3, .navbar-brand {
            font-family: 'Changa', sans-serif !important;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* EFECTO DE ILUMINACIÓN AL PASAR EL CURSOR */
        h1:hover, h2:hover, h3:hover, .navbar-brand:hover {
            text-shadow: 0 0 15px rgba(13, 110, 253, 0.8), 0 0 30px rgba(13, 110, 253, 0.4);
            transition: text-shadow 0.3s ease;
        }

        .hover-light:hover {
            color: #ffffff !important;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* Navbar futurista */
        .navbar-futurista {
            background: rgba(11, 15, 25, 0.9) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Contenedor principal con el Video de Fondo */
        .auth-section {
            position: relative;
            background-color: #0b0f19;
            overflow-y: auto;
            min-height: calc(100vh - 76px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 0;
        }

        .hero-video-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 0;
            opacity: 0.45;
        }

        .hero-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(13, 110, 253, 0.2) 0%, rgba(11, 15, 25, 0.92) 85%);
            z-index: 1;
        }

        /* Tarjetas de Perfil independientes */
        .auth-card {
            background: rgba(18, 22, 33, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(13, 110, 253, 0.3);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.85);
            transition: all 0.3s ease;
        }

        .auth-card:hover {
            box-shadow: 0 0 35px rgba(13, 110, 253, 0.4);
            border-color: #0d6efd;
        }

        .avatar-option {
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .avatar-option:hover {
            transform: scale(1.1);
            border-color: #0d6efd !important;
        }

        .btn-neon {
            background: linear-gradient(135deg, #dc3545 0%, #a71d2a 100%);
            border: none;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(220, 53, 69, 0.4);
            transition: all 0.3s ease;
        }

        .btn-neon:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(220, 53, 69, 0.8);
            color: #fff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        /* Estilo para las alertas personalizadas dentro de la web */
        .mensaje-flotante {
            display: none;
            border-radius: 10px;
            font-family: monospace;
            font-size: 0.9rem;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- 1. BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-futurista sticky-top border-bottom border-secondary" style="z-index: 10;">
        <div class="container">
            <a class="navbar-brand text-danger d-flex align-items-center gap-2" href="index.html">
                <img src="img/logo.gif" alt="Logo Akiba Store" width="40" height="40" class="rounded-circle border border-danger object-fit-cover">
                <span class="text-light">Akiba <span class="text-primary">Store</span></span>
            </a>
            
            <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="bi bi-house-fill me-1"></i> Volver al Inicio
            </a>
        </div>
    </nav>

    <!-- 2. SECCIÓN DE PERFIL CON VIDEO DE FONDO -->
    <section class="auth-section flex-grow-1">
        <video autoplay muted loop playsinline class="hero-video-bg">
            <source src="video/loginyregistro.mp4" type="video/mp4">
            Tu navegador no soporta videos HTML5.
        </video>
        <div class="hero-overlay"></div>

        <div class="container position-relative z-2 py-4" style="max-width: 580px;">
            
            <!-- TARJETA 1: IDENTIDAD VISUAL Y NOMBRE -->
            <div class="auth-card p-4 p-md-5 text-light mb-4">
                <div class="text-center mb-4 border-bottom border-secondary pb-3">
                    <h2 class="h3 text-white mb-1">Mi Perfil</h2>
                    <p class="text-light small font-monospace mb-0">Actualiza tu identidad visual y nombre de usuario.</p>
                </div>

                <!-- Alerta personalizada para Perfil -->
                <div id="alertaPerfil" class="alert alert-success mensaje-flotante text-center mb-3" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i> ¡Perfil actualizado con éxito! Redirigiendo...
                </div>

                <form id="formPerfil">
                    <div class="text-center mb-4">
                        <label class="form-label small fw-bold text-primary d-block mb-2">Avatar Actual</label>
                        <img id="previewAvatar" src="img/logo.gif" alt="Avatar" width="90" height="90" class="rounded-circle border border-danger object-fit-cover shadow-lg mb-3">
                        
                        <div class="text-start mb-3">
                            <label for="nombreUsuario" class="form-label small fw-bold text-light">Nombre de Usuario</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary fw-bold" id="nombreUsuario" required>
                        </div>
                    </div>

                    <!-- Subir foto desde el equipo -->
                    <div class="mb-3 text-start">
                        <label for="inputSubirImagen" class="form-label small fw-bold text-light">Subir foto desde tu equipo:</label>
                        <input class="form-control form-control-sm bg-dark text-light border-secondary" type="file" id="inputSubirImagen" accept="image/*">
                    </div>

                    <!-- Colección de Avatares -->
                    <div class="mb-4 text-start">
                        <label class="form-label small fw-bold text-light">O elige un avatar de la colección:</label>
                        <div class="d-flex justify-content-center gap-3 flex-wrap mt-2">
                            <img src="img/rock.jpg" width="50" height="50" class="rounded-circle border border-secondary object-fit-cover avatar-option" onclick="seleccionarAvatar('img/rock.jpg')">
                            <img src="img/chica2.jpg" width="50" height="50" class="rounded-circle border border-secondary object-fit-cover avatar-option" onclick="seleccionarAvatar('img/chica2.jpg')">
                            <img src="img/cine.jpg" width="50" height="50" class="rounded-circle border border-secondary object-fit-cover avatar-option" onclick="seleccionarAvatar('img/cine.jpg')">
                            <img src="img/chicaanime.jpg" width="50" height="50" class="rounded-circle border border-secondary object-fit-cover avatar-option" onclick="seleccionarAvatar('img/chicaanime.jpg')">
                            <img src="img/logo.gif" width="50" height="50" class="rounded-circle border border-secondary object-fit-cover avatar-option" onclick="seleccionarAvatar('img/logo.gif')">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-neon w-100 py-2 rounded-pill">Guardar Cambios de Perfil</button>
                </form>
            </div>

            <!-- TARJETA 2: SEGUNDA CAJA ABAJO PARA SEGURIDAD Y CONTRASEÑA -->
            <div class="auth-card p-4 p-md-4 text-light">
                <div class="mb-3 border-bottom border-secondary pb-2">
                    <h3 class="h6 text-primary fw-bold mb-1"><i class="bi bi-shield-lock-fill me-2"></i>Seguridad y Contraseña</h3>
                    <p class="text-white-50 small mb-0 font-monospace">Gestiona el cambio de tu contraseña de acceso.</p>
                </div>

                <!-- Alerta personalizada para Contraseña -->
                <div id="alertaSeguridad" class="alert alert-success mensaje-flotante text-center mb-3" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i> ¡Contraseña actualizada con éxito!
                </div>
                
                <form id="formSeguridad">
                    <div class="mb-3 text-start">
                        <label for="passwordActual" class="form-label small fw-bold text-light">Contraseña Actual</label>
                        <input type="password" class="form-control form-control-sm bg-dark text-light border-secondary" id="passwordActual" placeholder="Ingresa tu contraseña actual">
                    </div>

                    <div class="mb-3 text-start">
                        <label for="nuevaPassword" class="form-label small fw-bold text-light">Nueva Contraseña</label>
                        <input type="password" class="form-control form-control-sm bg-dark text-light border-secondary" id="nuevaPassword" placeholder="Mínimo 6 caracteres">
                    </div>

                    <button type="submit" class="btn btn-outline-primary w-100 py-2 rounded-pill fw-bold">Actualizar Contraseña</button>
                </form>
            </div>

        </div>
    </section>

    <!-- SCRIPT DE PERFIL CON MENSAJES PERSONALIZADOS -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const nombreActual = localStorage.getItem("akiba_nombre") || "sebapeo";
            const avatarActual = localStorage.getItem("akiba_avatar") || "img/logo.gif";

            document.getElementById("nombreUsuario").value = nombreActual;
            document.getElementById("previewAvatar").src = avatarActual;
        });

        function seleccionarAvatar(ruta) {
            document.getElementById("previewAvatar").src = ruta;
        }

        // Manejar subida de imagen local
        document.getElementById("inputSubirImagen").addEventListener("change", function(event) {
            const archivo = event.target.files[0];
            if (archivo) {
                const lector = new FileReader();
                lector.onload = function(e) {
                    document.getElementById("previewAvatar").src = e.target.result;
                }
                lector.readAsDataURL(archivo);
            }
        });

        // Guardar cambios del formulario principal de perfil con mensaje personalizado
        document.getElementById("formPerfil").addEventListener("submit", function(e) {
            e.preventDefault();
            const nuevoNombre = document.getElementById("nombreUsuario").value;
            const nuevoAvatar = document.getElementById("previewAvatar").src;

            localStorage.setItem("akiba_nombre", nuevoNombre);
            localStorage.setItem("akiba_avatar", nuevoAvatar);

            const alerta = document.getElementById("alertaPerfil");
            alerta.style.display = "block";

            setTimeout(() => {
                window.location.href = "index.html";
            }, 1200);
        });

        // Guardar cambios de contraseña con mensaje personalizado
        document.getElementById("formSeguridad").addEventListener("submit", function(e) {
            e.preventDefault();
            const passActual = document.getElementById("passwordActual").value;
            const nuevaPass = document.getElementById("nuevaPassword").value;

            if (passActual.trim() === "") {
                alert("Por favor ingresa tu contraseña actual.");
                return;
            }
            if (nuevaPass.trim() === "" || nuevaPass.length < 6) {
                alert("Por favor ingresa una nueva contraseña válida (mínimo 6 caracteres).");
                return;
            }

            localStorage.setItem("akiba_password", nuevaPass);
            
            const alerta = document.getElementById("alertaSeguridad");
            alerta.style.display = "block";

            document.getElementById("formSeguridad").reset();

            setTimeout(() => {
                alerta.style.display = "none";
            }, 2500);
        });
    </script>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
