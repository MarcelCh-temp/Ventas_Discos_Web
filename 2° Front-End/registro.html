<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Akiba Store</title>
    
    <!-- Google Fonts: Changa -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@700;800&display=swap" rel="stylesheet">

    <!-- CSS local de Bootstrap -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background-color: #0b0f19;
            color: #f8f9fa;
        }
        
        h1, h2, h3, .navbar-brand {
            font-family: 'Changa', sans-serif !important;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* EFECTO DE ILUMINACIÓN AL PASAR EL CURSOR */
        h1:hover, h2:hover, h3:hover, .navbar-brand:hover {
            text-shadow: 0 0 15px rgba(13, 110, 253, 0.8), 0 0 30px rgba(13, 110, 253, 0.4);
            transition: text-shadow 0.3s ease;
        }

        .hover-light:hover {
            color: #ffffff !important;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* Navbar futurista */
        .navbar-futurista {
            background: rgba(11, 15, 25, 0.9) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Contenedor principal con el Video de Fondo */
        .auth-section {
            position: relative;
            background-color: #0b0f19;
            overflow: hidden;
            min-height: calc(100vh - 76px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }

        .hero-video-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 0;
            opacity: 0.5;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(13, 110, 253, 0.2) 0%, rgba(11, 15, 25, 0.9) 85%);
            z-index: 1;
        }

        /* Tarjeta de Formulario */
        .auth-card {
            background: rgba(18, 22, 33, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(13, 110, 253, 0.3);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            transition: all 0.3s ease;
        }

        .auth-card:hover {
            box-shadow: 0 0 30px rgba(13, 110, 253, 0.4);
            border-color: #0d6efd;
        }

        .btn-neon {
            background: linear-gradient(135deg, #0d6efd 0%, #0043a8 100%);
            border: none;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(13, 110, 253, 0.4);
            transition: all 0.3s ease;
        }

        .btn-neon:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(13, 110, 253, 0.8);
            color: #fff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- 1. BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-futurista sticky-top border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand text-danger d-flex align-items-center gap-2" href="index.html">
                <img src="img/logo.gif" alt="Logo Akiba Store" width="40" height="40" class="rounded-circle border border-danger object-fit-cover">
                <span class="text-light">Akiba <span class="text-primary">Store</span></span>
            </a>
            
            <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="bi bi-house-fill me-1"></i> Volver al Inicio
            </a>
        </div>
    </nav>

    <!-- 2. SECCIÓN DE REGISTRO CON VIDEO DE FONDO -->
    <section class="auth-section flex-grow-1">
        <video autoplay muted loop playsinline class="hero-video-bg">
            <source src="video/fondo.mp4" type="video/mp4">
            Tu navegador no soporta videos HTML5.
        </video>
        <div class="hero-overlay"></div>

        <div class="container position-relative z-2" style="max-width: 450px;">
            <div class="auth-card p-4 p-md-5 text-light">
                <div class="text-center mb-4">
                    <h2 class="h3 text-white mb-2">Crear Cuenta</h2>
                    <p class="text-white-50 small font-monospace">Únete a la comunidad de Akiba Store</p>
                </div>

                <form id="formRegistro">
                    <div class="mb-3">
                        <label for="regNombre" class="form-label small fw-bold">Nombre de Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark text-primary border-secondary"><i class="bi bi-person-fill"></i></span>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="regNombre" placeholder="Tu nombre" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="regEmail" class="form-label small fw-bold">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark text-primary border-secondary"><i class="bi bi-envelope-fill"></i></span>
                            <input type="email" class="form-control bg-dark text-light border-secondary" id="regEmail" placeholder="tucorreo@ejemplo.cl" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="regPassword" class="form-label small fw-bold">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark text-primary border-secondary"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control bg-dark text-light border-secondary" id="regPassword" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-neon w-100 py-2 mb-3 rounded-pill">REGISTRARSE</button>

                    <div class="text-center">
                        <p class="small text-white-50 mb-0">¿Ya tienes una cuenta? <a href="login.html" class="text-primary text-decoration-none fw-bold hover-light">Ingresa aquí</a></p>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- SCRIPT DE REGISTRO -->
    <script>
        document.getElementById("formRegistro").addEventListener("submit", function(e) {
            e.preventDefault();
            const nombreInput = document.getElementById("regNombre").value;
            
            // Guardar sesión automática al registrarse
            localStorage.setItem("akiba_sesion", "true");
            localStorage.setItem("akiba_nombre", nombreInput);
            localStorage.setItem("akiba_avatar", "img/logo.gif");

            alert("¡Registro exitoso! Bienvenido a Akiba Store.");
            window.location.href = "index.html";
        });
    </script>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
