# Lote 1: configuración SOLO de pruebas. H2 en memoria: mvnw test no necesita XAMPP.
spring.datasource.url=jdbc:h2:mem:ordenes;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Lote 3: secreto solo de pruebas y servicios externos en puertos sin nada (en los IT se simulan los clientes)
security.jwt.secret=test-secret-de-al-menos-32-caracteres-xx
services.catalog.url=http://127.0.0.1:1
services.notifications.url=http://127.0.0.1:1
# Lote 5: en los IT AccountsClient se simula
services.accounts.url=http://127.0.0.1:1

# Lote 6 · DOC-05: secreto de servicio SOLO de pruebas (distinto del de usuarios)
security.service-jwt.secret=test-service-secret-de-al-menos-32-caracteres
