spring.application.name=ms-ordenes
server.port=${PORT:8084}
# Lote 3: igual que ms-catalog y ms-notifications. Medida COMPLEMENTARIA para /api/v1/internal/** (no es
# autenticación; el token de servicio llega en el Lote 6, DOC-05). Para otro PC: SERVER_ADDRESS=0.0.0.0
server.address=${SERVER_ADDRESS:127.0.0.1}

# Lote 1: lee variables locales desde .env (igual que ms-accounts). Ver .env.example
spring.config.import=optional:file:.env[.properties]

# Configuración de BD MySQL (XAMPP)
# Lote 1: misma base, mismo driver y mismos valores por defecto; solo se pueden cambiar desde el .env
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_ordenes?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
# Lote 3: "update" solo AGREGA las columnas y tablas nuevas; no borra la tabla ordenes ni sus filas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Lote 3: secreto del JWT emitido por ms-accounts. OBLIGATORIO y el MISMO en todos los MS (mín. 32 caracteres).
security.jwt.secret=${JWT_SECRET}

# Lote 3: MS-Catalog (precios, promociones, disponibilidad y descuento/reposición idempotente de stock)
services.catalog.url=${CATALOG_URL:http://127.0.0.1:8082}
# Lote 3: MS-Notifications (avisos de pedido). Si no responde, el pedido se guarda igual.
services.notifications.url=${NOTIFICATIONS_URL:http://127.0.0.1:8086}

# Swagger (mismas rutas que los demás MS)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Lote 5 (HU-78, RN-37, RN-44): MS-Accounts confirma que la cuenta está ACTIVA antes de confirmar una compra.
# Si no responde, la compra se rechaza con 503 (no se crea el pedido).
services.accounts.url=${ACCOUNTS_URL:http://127.0.0.1:8081}

# ---- Lote 6 · DOC-05: JWT de servicio (llamadas MS -> MS). Secreto DISTINTO de JWT_SECRET, el mismo en los 6 MS ----
security.service-jwt.secret=${SERVICE_JWT_SECRET}
# ---- Lote 6 · DOC-06: el correlationId aparece en cada línea de log ----
logging.pattern.correlation=[%X{correlationId:-}]\u0020

management.endpoints.web.exposure.include=health,info
