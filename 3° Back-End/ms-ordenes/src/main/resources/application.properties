
spring.application.name=ms-ordenes
server.port=${PORT:8084}

# Lote 3: igual que ms-catalog y ms-notifications.
# Medida COMPLEMENTARIA para /api/v1/internal/**
server.address=${SERVER_ADDRESS:127.0.0.1}

# Lee variables locales desde .env
spring.config.import=optional:file:.env[.properties]

# Configuración de BD MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/bd_ordenes?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
# update conserva las tablas y registros existentes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# JWT emitido por MS-Accounts
security.jwt.secret=${JWT_SECRET}

# Conexión con MS-Catalog
services.catalog.url=${CATALOG_URL:http://127.0.0.1:8082}

# Conexión con MS-Notifications
services.notifications.url=${NOTIFICATIONS_URL:http://127.0.0.1:8086}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Conexión con MS-Accounts
services.accounts.url=${ACCOUNTS_URL:http://127.0.0.1:8081}

# JWT de servicio (MS -> MS)
security.service-jwt.secret=${SERVICE_JWT_SECRET}

# Correlation ID
logging.pattern.correlation=[%X{correlationId:-}]\u0020

# Actuator
management.endpoints.web.exposure.include=health,info

# Tarifa ficticia editable del despacho para probar premio de ruleta.
nackson.shipping.fee=${NACKSON_SHIPPING_FEE:3990}
