
# ==========================================
# CONFIGURACION GENERAL
# ==========================================

spring.application.name=ms-postsale
server.port=8085
# Lote 4: igual que ms-catalog, ms-notifications y ms-ordenes. Medida COMPLEMENTARIA (no es autenticación) mientras
# llega el token de servicio del Lote 6 (DOC-05). Para usarlo desde otro PC: SERVER_ADDRESS=0.0.0.0
server.address=${SERVER_ADDRESS:127.0.0.1}

# Lote 4: lee variables locales desde .env (igual que ms-accounts y ms-ordenes). Ver .env.example
spring.config.import=optional:file:.env[.properties]

# ==========================================
# BASE DE DATOS - MARIADB
# ==========================================

# Crear automaticamente la base de datos si no existe
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/bd_ms_postsale?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

# Crear o actualizar automaticamente las tablas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ==========================================
# SWAGGER / OPENAPI
# ==========================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==========================================
# COMUNICACION ENTRE MICROSERVICIOS
# ==========================================

# Lote 4: contratos INTERNOS de Orders del Lote 3 (/api/v1/internal/orders/**). Ya no existe /api/ordenes.
services.orders.url=${ORDERS_URL:http://127.0.0.1:8084}
# Lote 4: el inventario ahora vive en MS-Catalog (Lote 2): reposiciones en 8082 con prefijo POSTSALE- (DOC-08).
# Reemplaza a services.inventory.url (MS-Inventory, 8083), que PostSale ya no usa.
services.catalog.url=${CATALOG_URL:http://127.0.0.1:8082}
services.notifications.url=${NOTIFICATIONS_URL:http://127.0.0.1:8086}
# Lote 5 (HU-78, RN-37, RN-44): MS-Accounts confirma que la cuenta está ACTIVA antes de crear una solicitud.
# Si no responde, se rechaza con 503 (no se crea la solicitud).
services.accounts.url=${ACCOUNTS_URL:http://127.0.0.1:8081}

# Lote 4: secreto del JWT emitido por ms-accounts. OBLIGATORIO y el MISMO en todos los MS (mínimo 32 caracteres).
security.jwt.secret=${JWT_SECRET}

# Lote 4 (ERS 11.7): si Catalog no confirmó una reposición de devolución, se reintenta con la MISMA operacionId
# (Catalog no repone dos veces). Cada 5 minutos por defecto; con "false" se desactiva y la operación queda PENDIENTE.
postsale.reposiciones.reintento-habilitado=${REPOSICION_REINTENTO:true}
postsale.reposiciones.reintento-ms=300000
spring.jpa.database-platform=com.ventasdiscos.mspostsale.config.MariaDB104Dialect

# ---- Lote 6 · DOC-05: JWT de servicio (llamadas MS -> MS). Secreto DISTINTO de JWT_SECRET, el mismo en los 6 MS ----
security.service-jwt.secret=${SERVICE_JWT_SECRET}
# ---- Lote 6 · DOC-06: el correlationId aparece en cada línea de log ----
logging.pattern.correlation=[%X{correlationId:-}]\u0020
