
# ==========================================
# CONFIGURACION GENERAL
# ==========================================

spring.application.name=ms-postsale
server.port=8085

# Conexiones locales por defecto
server.address=${SERVER_ADDRESS:127.0.0.1}

# Variables locales desde .env
spring.config.import=optional:file:.env[.properties]


# ==========================================
# BASE DE DATOS - MYSQL / MARIADB (XAMPP)
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_ms_postsale?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

# Actualizar las tablas existentes
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Dialecto para MariaDB
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MariaDBDialect}


# ==========================================
# SWAGGER / OPENAPI
# ==========================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


# ==========================================
# COMUNICACION ENTRE MICROSERVICIOS
# ==========================================

# MS-Ordenes
services.orders.url=${ORDERS_URL:http://127.0.0.1:8084}

# MS-Catalog: inventario y reposiciones
services.catalog.url=${CATALOG_URL:http://127.0.0.1:8082}

# MS-Notifications
services.notifications.url=${NOTIFICATIONS_URL:http://127.0.0.1:8086}

# MS-Accounts
services.accounts.url=${ACCOUNTS_URL:http://127.0.0.1:8081}


# ==========================================
# SEGURIDAD JWT
# ==========================================

security.jwt.secret=${JWT_SECRET}

# JWT interno entre microservicios
security.service-jwt.secret=${SERVICE_JWT_SECRET}


# ==========================================
# REINTENTOS DE REPOSICIONES
# ==========================================

postsale.reposiciones.reintento-habilitado=${REPOSICION_REINTENTO:true}
postsale.reposiciones.reintento-ms=300000


# ==========================================
# TRAZABILIDAD
# ==========================================

logging.pattern.correlation=[%X{correlationId:-}]\u0020


# ==========================================
# ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health,info
