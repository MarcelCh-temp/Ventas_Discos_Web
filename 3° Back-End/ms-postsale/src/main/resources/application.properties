
# ==========================================
# CONFIGURACION GENERAL
# ==========================================

spring.application.name=ms-postsale
server.port=8085

# ==========================================
# BASE DE DATOS - MARIADB
# ==========================================

# Crear automaticamente la base de datos si no existe
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/bd_ms_postsale?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

# Crear o actualizar automaticamente las tablas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ==========================================
# SWAGGER / OPENAPI
# ==========================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==========================================
# COMUNICACION ENTRE MICROSERVICIOS
# ==========================================

services.orders.url=${ORDERS_URL:http://localhost:8084}
services.inventory.url=${INVENTORY_URL:http://localhost:8083}
services.notifications.url=${NOTIFICATIONS_URL:http://localhost:8086}
spring.jpa.database-platform=com.ventasdiscos.mspostsale.config.MariaDB104Dialect