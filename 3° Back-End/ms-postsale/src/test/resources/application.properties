# Lote 4: configuración SOLO de pruebas. H2 en memoria (modo MySQL, igual que ms-ordenes): mvnw test no necesita XAMPP.
# La aplicación real sigue con MariaDB, el mismo driver y el mismo dialecto (no se cambiaron).
spring.datasource.url=jdbc:h2:mem:postsale;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Secreto solo de pruebas y servicios externos en un puerto sin nada (en los IT se simulan los clientes)
security.jwt.secret=test-secret-de-al-menos-32-caracteres-xx
services.orders.url=http://127.0.0.1:1
services.catalog.url=http://127.0.0.1:1
services.notifications.url=http://127.0.0.1:1
services.accounts.url=http://127.0.0.1:1
# El reintento programado se prueba llamando directamente al Service
postsale.reposiciones.reintento-habilitado=false

# Lote 6 · DOC-05: secreto de servicio SOLO de pruebas (distinto del de usuarios)
security.service-jwt.secret=test-service-secret-de-al-menos-32-caracteres
