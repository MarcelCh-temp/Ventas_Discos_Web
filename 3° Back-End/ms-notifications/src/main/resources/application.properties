
spring.application.name=ms-notifications
server.port=8086
# Lote 1: este MS tiene rutas /api/v1/internal/** (solo entre microservicios; el Gateway no las publica).
# Por defecto solo acepta conexiones desde este mismo PC. Para otro PC: SERVER_ADDRESS=0.0.0.0 en el .env
server.address=${SERVER_ADDRESS:127.0.0.1}

# Lote 1: lee variables locales desde .env (igual que ms-accounts). Ver .env.example
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/bd_ms_notifications}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Lote 1: secreto del JWT emitido por ms-accounts. OBLIGATORIO y el MISMO en todos los MS (mín. 32 caracteres).
security.jwt.secret=${JWT_SECRET}

# ---- Lote 6 · DOC-05: JWT de servicio (llamadas MS -> MS). Secreto DISTINTO de JWT_SECRET, el mismo en los 6 MS ----
security.service-jwt.secret=${SERVICE_JWT_SECRET}
# ---- Lote 6 · DOC-06: el correlationId aparece en cada línea de log ----
logging.pattern.correlation=[%X{correlationId:-}]\u0020

# ---- Cierre (RN-44): MS-Accounts confirma que la cuenta del CLIENTE está ACTIVA (127.0.0.1: escucha solo ahí) ----
services.accounts.url=${ACCOUNTS_URL:http://127.0.0.1:8081}
