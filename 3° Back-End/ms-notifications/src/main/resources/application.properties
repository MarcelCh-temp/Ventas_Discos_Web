
# ============================================================
# MS-NOTIFICATIONS - AKIBA STORE
# Configuracion del microservicio de notificaciones
# ============================================================


# Nombre del microservicio dentro de Spring Boot
spring.application.name=ms-notifications


# Puerto donde se ejecuta MS-Notifications
server.port=8086


# Por seguridad, solo acepta conexiones locales por defecto.
# Para conexiones desde otro equipo, configurar SERVER_ADDRESS.
server.address=${SERVER_ADDRESS:127.0.0.1}




# ============================================================
# VARIABLES DE ENTORNO
# ============================================================


# Carga las variables desde el archivo .env local.
# El archivo debe estar en el directorio de ejecucion del MS.
spring.config.import=optional:file:.env[.properties]




# ============================================================
# BASE DE DATOS MYSQL
# ============================================================


# Conexion a MySQL.
# createDatabaseIfNotExist=true permite intentar crear la BD
# automaticamente si no existe y el usuario tiene permisos.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_ms_notifications?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}


# Usuario de la base de datos
spring.datasource.username=${DB_USERNAME:root}


# Contrasena de MySQL (configurar en .env)
spring.datasource.password=${DB_PASSWORD:}


# Driver JDBC oficial de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver




# ============================================================
# JPA E HIBERNATE
# ============================================================


# Crea o actualiza las tablas a partir de las entidades @Entity.
# No elimina las tablas existentes como lo haria create-drop.
spring.jpa.hibernate.ddl-auto=update


# Evita mostrar todas las consultas SQL en consola
spring.jpa.show-sql=false


# Formato legible para consultas SQL registradas
spring.jpa.properties.hibernate.format_sql=true


# Evita mantener la sesion JPA abierta durante la respuesta HTTP
spring.jpa.open-in-view=false




# ============================================================
# DOCUMENTACION DE API - SWAGGER
# ============================================================


# Ruta de documentacion OpenAPI
springdoc.api-docs.path=/v3/api-docs


# Interfaz visual de Swagger
springdoc.swagger-ui.path=/swagger-ui.html




# ============================================================
# SEGURIDAD JWT
# ============================================================


# Secreto para validar los JWT de los usuarios.
# Debe coincidir con el utilizado por MS-Accounts y Gateway.
# Debe estar definido en el entorno.
security.jwt.secret=${JWT_SECRET}


# Secreto para la comunicacion interna entre microservicios.
# Debe ser diferente de JWT_SECRET y compartido por los 6 MS.
security.service-jwt.secret=${SERVICE_JWT_SECRET}




# ============================================================
# TRAZABILIDAD
# ============================================================


# Permite identificar una misma solicitud entre microservicios.
# correlationId ayuda a seguir errores en los logs.
logging.pattern.correlation=[%X{correlationId:-}]\u0020




# ============================================================
# COMUNICACION CON MS-ACCOUNTS
# ============================================================


# URL del microservicio de cuentas.
# Se utiliza para consultar el estado ACTIVA de un cliente.
services.accounts.url=${ACCOUNTS_URL:http://127.0.0.1:8081}