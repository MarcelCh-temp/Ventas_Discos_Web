
# ==========================================
# MS-NOTIFICATIONS - VENTAS DISCOS
# ==========================================

# CONFIGURACION GENERAL
spring.application.name=ms-notifications
server.port=8086

# ==========================================
# BASE DE DATOS - MARIADB
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/bd_ms_notifications}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# SEGURIDAD - EVENTOS INTERNOS
# ==========================================

notifications.internal.api-key=${NOTIFICATIONS_INTERNAL_API_KEY:}

# ==========================================
# SWAGGER / OPENAPI
# ==========================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
