
# ============================================================
# MS-NOTIFICATIONS - ÑACKSON STORE
# Configuración del microservicio de notificaciones
# ============================================================

spring.application.name=ms-notifications

# Puerto del microservicio
server.port=8086

# Solo conexiones locales por defecto
server.address=${SERVER_ADDRESS:127.0.0.1}


# ============================================================
# VARIABLES DE ENTORNO
# ============================================================

spring.config.import=optional:file:.env[.properties]


# ============================================================
# BASE DE DATOS MYSQL / MARIADB (XAMPP)
# ============================================================

spring.datasource.url=jdbc:mysql://localhost:3306/bd_ms_notifications?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# JPA E HIBERNATE
# ============================================================

# Actualizar estructura sin eliminar tablas existentes
spring.jpa.hibernate.ddl-auto=update

# No mostrar todas las consultas SQL
spring.jpa.show-sql=false

# Formato legible de consultas SQL
spring.jpa.properties.hibernate.format_sql=true

# Desactivar Open Session in View
spring.jpa.open-in-view=false

# Dialecto de MariaDB utilizado por XAMPP
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect


# ============================================================
# DOCUMENTACIÓN API - SWAGGER
# ============================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# ============================================================
# SEGURIDAD JWT
# ============================================================

security.jwt.secret=${JWT_SECRET}
security.service-jwt.secret=${SERVICE_JWT_SECRET}


# ============================================================
# TRAZABILIDAD
# ============================================================

logging.pattern.correlation=[%X{correlationId:-}]\u0020


# ============================================================
# COMUNICACIÓN CON MS-ACCOUNTS
# ============================================================

services.accounts.url=${ACCOUNTS_URL:http://127.0.0.1:8081}
