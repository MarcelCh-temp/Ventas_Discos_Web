
spring.application.name=ms-catalog
server.port=${PORT:8082}

# Lote 1: este MS tiene rutas /api/v1/internal/**
# (solo entre microservicios; el Gateway no las publica).
# Por defecto solo acepta conexiones desde este mismo PC.
# Para otro PC: SERVER_ADDRESS=0.0.0.0 en el .env
server.address=${SERVER_ADDRESS:127.0.0.1}

# Lee variables locales desde .env (si existe)
# al ejecutar con mvnw o VS Code. Ver .env.example
spring.config.import=optional:file:.env[.properties]

# ---- Base de datos MySQL ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_catalog?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MariaDBDialect}

# Secreto del JWT: OBLIGATORIO y el MISMO en ms-accounts,
# ms-catalog y los servicios que validan JWT de usuario.
# Minimo 32 caracteres.
# Sin valor por defecto: si falta JWT_SECRET, el MS no arranca.
security.jwt.secret=${JWT_SECRET}

# Lote 2 (UML 03): el inventario vive en este MS
# (tablas inventario y movimiento_stock de db_catalog).
# Umbral critico con que nace el inventario de un producto nuevo (RN-10).
inventory.umbral-critico-por-defecto=${UMBRAL_CRITICO_DEFECTO:5}

# Lote 6: CORS se administra SOLO en el API Gateway (8080).
management.endpoints.web.exposure.include=health,info

# ---- Swagger / OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Lote 5 (HU-78, RN-37, RN-44):
# MS-Accounts confirma que la cuenta esta ACTIVA
# antes de agregar un favorito.
# Si no responde, se rechaza con 503.
services.accounts.url=${ACCOUNTS_URL:http://127.0.0.1:8081}

# ---- Lote 6 - DOC-05: JWT de servicio (MS -> MS) ----
# Secreto DISTINTO de JWT_SECRET, compartido entre los 6 MS.
security.service-jwt.secret=${SERVICE_JWT_SECRET}

# ---- Lote 6 - DOC-06: Correlation ID ----
# El correlationId aparece en cada linea del log.
logging.pattern.correlation=[%X{correlationId:-}]\u0020
