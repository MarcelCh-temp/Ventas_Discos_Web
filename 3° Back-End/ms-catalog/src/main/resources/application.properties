spring.application.name=ms-catalog
server.port=${PORT:8082}

# Lee variables locales desde .env (si existe) al ejecutar con mvnw o VS Code. Ver .env.example
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_catalog?createDatabaseIfNotExist=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Secreto del JWT: OBLIGATORIO y el MISMO en ms-accounts, ms-catalog y ms-inventory (mín. 32 caracteres).
# Sin valor por defecto a propósito: si falta JWT_SECRET en el .env o en el entorno, el MS no arranca
# (mejor fallar al inicio que aceptar tokens con una clave conocida).
security.jwt.secret=${JWT_SECRET}

# MS-Inventory: URL configurable, nada hardcodeado en el código
services.inventory.url=${INVENTORY_URL:http://localhost:8083}
services.inventory.timeout-ms=${INVENTORY_TIMEOUT_MS:2000}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
management.endpoints.web.exposure.include=health,info

# ---- Swagger / OpenAPI (mismas rutas que los MS de referencia) ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
