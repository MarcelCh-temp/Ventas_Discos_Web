spring.application.name=ms-accounts
server.port=${PORT:8081}
# Lote 5: igual que los demás MS con rutas /internal/**. Medida COMPLEMENTARIA (no es autenticación) hasta el JWT de
# servicio del Lote 6 (DOC-05). Para usarlo desde otro PC: SERVER_ADDRESS=0.0.0.0
server.address=${SERVER_ADDRESS:127.0.0.1}

# Lee variables locales desde .env (si existe) al ejecutar con mvnw o VS Code. Ver .env.example
spring.config.import=optional:file:.env[.properties]

# ---- BD propia (Database per Service). MySQL/MariaDB de XAMPP ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_accounts?createDatabaseIfNotExist=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Secreto del JWT: OBLIGATORIO y el MISMO en los 3 MS (mín. 32 caracteres). Sin valor por defecto.
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# ---- Administrador inicial (opcional, por variables de entorno) ----
app.admin.rut=${ADMIN_RUT:}
app.admin.correo=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Lote 6 (decisión 2/4): el CORS se administra SOLO en el API Gateway (8080); se retiró app.cors.allowed-origins.

management.endpoints.web.exposure.include=health,info

# ---- Swagger / OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# ---- Lote 5 (HU-78): MS que Accounts consulta antes de eliminar una cuenta y donde depura datos ----
services.orders.url=${ORDERS_URL:http://127.0.0.1:8084}
services.support.url=${SUPPORT_URL:http://127.0.0.1:8087}
services.postsale.url=${POSTSALE_URL:http://127.0.0.1:8085}
services.catalog.url=${CATALOG_URL:http://127.0.0.1:8082}
services.notifications.url=${NOTIFICATIONS_URL:http://127.0.0.1:8086}

# Lote 5 (ERS 13.7): reintento de las eliminaciones que quedaron EN_ELIMINACION. Cada 5 minutos por defecto;
# con ELIMINACION_REINTENTO=false se desactiva (la cuenta queda EN_ELIMINACION y el Cliente puede repetir el DELETE).
accounts.eliminacion.reintento-habilitado=${ELIMINACION_REINTENTO:true}
accounts.eliminacion.reintento-ms=300000

# ---- Lote 6 · DOC-05: JWT de servicio (llamadas MS -> MS). Secreto DISTINTO de JWT_SECRET, el mismo en los 6 MS ----
security.service-jwt.secret=${SERVICE_JWT_SECRET}
# ---- Lote 6 · DOC-06: el correlationId aparece en cada línea de log ----
logging.pattern.correlation=[%X{correlationId:-}]\u0020
