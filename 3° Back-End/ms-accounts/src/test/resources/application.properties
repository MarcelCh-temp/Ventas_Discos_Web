# Configuración de pruebas: H2 en memoria, no requiere XAMPP.
spring.datasource.url=jdbc:h2:mem:accounts;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
security.jwt.secret=test-secret-de-al-menos-32-caracteres-xx
security.jwt.expiration-minutes=60
# Lote 5: los otros MS se simulan en las pruebas; puerto sin nada por si alguna prueba usa el cliente real
services.orders.url=http://127.0.0.1:1
services.support.url=http://127.0.0.1:1
services.postsale.url=http://127.0.0.1:1
services.catalog.url=http://127.0.0.1:1
services.notifications.url=http://127.0.0.1:1
# El reintento programado se prueba llamando directamente al Service
accounts.eliminacion.reintento-habilitado=false

# Lote 6 · DOC-05: secreto de servicio SOLO de pruebas (distinto del de usuarios)
security.service-jwt.secret=test-service-secret-de-al-menos-32-caracteres
