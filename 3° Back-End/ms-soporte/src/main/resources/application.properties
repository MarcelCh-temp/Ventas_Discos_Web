
# Nombre y puerto del microservicio
spring.application.name=ms-soporte
server.port=${SERVER_PORT:8087}

# Lote 5 (HU-78): rutas internas entre microservicios
server.address=${SERVER_ADDRESS:127.0.0.1}

# Variables locales
spring.config.import=optional:file:.env[.properties]

# ============================================================
# BASE DE DATOS MYSQL / MARIADB (XAMPP)
# ============================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_soporte?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ============================================================
# JPA E HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto compatible con MariaDB
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MariaDBDialect}

spring.jpa.open-in-view=false

# ============================================================
# SEGURIDAD JWT
# ============================================================

security.jwt.secret=${JWT_SECRET}

# ============================================================
# COMUNICACIÓN ENTRE MICROSERVICIOS
# ============================================================

# Notificaciones
services.notifications.url=${NOTIFICATIONS_URL:http://127.0.0.1:8086}

# Cuentas
services.accounts.url=${ACCOUNTS_URL:http://127.0.0.1:8081}

# Órdenes
services.orders.url=${ORDERS_URL:http://127.0.0.1:8084}

# ============================================================
# SWAGGER / OPENAPI
# ============================================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================================
# JWT DE SERVICIO
# ============================================================

security.service-jwt.secret=${SERVICE_JWT_SECRET}

# ============================================================
# TRAZABILIDAD
# ============================================================

logging.pattern.correlation=[%X{correlationId:-}]\u0020
