# Nombre y puerto del microservicio
spring.application.name=ms-soporte
server.port=8087

# Configuración de base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/bd_soporte?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Formato SQL en consola y dialecto de MySQL
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect